<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập — Nhà thông minh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=18">
  <link rel="stylesheet" href="css/auth.css?v=18">
  <script src="js/session.js?v=18"></script>
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      </div>
      <div>
        <h1>Nhà thông minh</h1>
        <p class="sub">Đăng nhập để tiếp tục</p>
      </div>
    </div>

    <form class="login-form" id="loginForm" novalidate>
      <p class="form-msg ok" id="loginInfo" role="status" hidden></p>
      <p class="login-error" id="loginError" role="alert" hidden></p>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" spellcheck="false" autofocus>
      </div>
      <div class="field">
        <label for="password">Mật khẩu</label>
        <div class="password-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password">
          <button type="button" class="password-toggle" id="btnTogglePassword" aria-label="Hiện mật khẩu" aria-pressed="false">
            <svg class="eye-open" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-closed" hidden viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10.4 10.4 0 0 1 12 19c-6.5 0-10-7-10-7a18 18 0 0 1 4.1-5.1M9.9 5.2A9.6 9.6 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-2.2 3.2M14.1 14.1a3 3 0 1 1-4.2-4.2M2 2l20 20"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" id="btnLogin" class="btn primary">Đăng nhập</button>
    </form>

    <p class="muted login-foot">Chưa có tài khoản? <a href="register.html">Đăng ký</a></p>
  </main>

  <script src="js/login.js?v=18"></script>
</body>
</html>
