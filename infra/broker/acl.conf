# ACL mẫu (dùng khi tắt allow_anonymous)
# %c = client id, %u = username
# Tạo user: mosquitto_passwd -c passwd dashboard ; mosquitto_passwd passwd automation ; ...

# Dashboard: đọc mọi thứ, chỉ được GỬI LỆNH (set) — không thể giả mạo state của thiết bị
user dashboard
topic read home/#
topic write home/+/+/set
topic write home/_auto/+/set
topic write home/_dashboard/#
topic read $SYS/#

# Automation engine: đọc trạng thái, gửi lệnh, quản lý nhánh _auto
user automation
topic read home/+/+/status
topic read home/+/+/state
topic write home/+/+/set
topic readwrite home/_auto/#

# Logger: chỉ đọc
user logger
topic read home/#

# Bộ giả lập: 1 user cho mọi thiết bị ảo
user simulator
topic write home/+/+/status
topic write home/+/+/state
topic read home/+/+/set

# ESP32 thật: username = node id, chỉ được ghi vào phòng của mình
user esp32-01
topic write home/lab/+/status
topic write home/lab/+/state
topic read home/lab/+/set

# Notifier (Telegram/Email): chỉ đọc cảnh báo từ automation
user notifier
topic read home/_auto/notify/event
