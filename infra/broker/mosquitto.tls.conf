# ==========================================================
#  Mosquitto chạy trực tiếp (không Docker) — bản BẬT TLS
#  Giống mosquitto.local.conf, thêm 2 cổng mã hóa. Xem docs/TLS.md.
#
#  Tạo chứng chỉ trước (một lần):  python infra/broker/gen_certs.py
#  Chạy từ thư mục gốc repo:       mosquitto -c infra/broker/mosquitto.tls.conf -v
#
#  | Cổng | Giao thức           | Mã hóa | Dùng cho                                       |
#  |------|---------------------|--------|------------------------------------------------|
#  | 1883 | MQTT/TCP            | Không  | so sánh khi demo Wireshark, ESP32 chưa bật TLS |
#  | 9001 | MQTT/WebSocket      | Không  | dashboard ws://                                |
#  | 8883 | MQTT/TLS            | Có     | script Python (--tls), ESP32 (MQTT_USE_TLS 1)  |
#  | 8443 | MQTT/WebSocket TLS  | Có     | dashboard wss:// (?tls=1)                      |
#
#  Muốn CHỈ cho kết nối mã hóa: xóa 2 khối listener 1883 và 9001.
# ==========================================================

persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%d %H:%M:%S

sys_interval 5

# --- Không mã hóa (giữ lại để so sánh)
listener 1883
protocol mqtt

listener 9001
protocol websockets

# --- MQTT over TLS (cổng chuẩn IANA cho MQTT/TLS là 8883)
listener 8883
protocol mqtt
certfile infra/broker/certs/server.crt
keyfile infra/broker/certs/server.key
tls_version tlsv1.2

# --- MQTT over WebSocket + TLS (wss://) cho trình duyệt
listener 8443
protocol websockets
certfile infra/broker/certs/server.crt
keyfile infra/broker/certs/server.key
tls_version tlsv1.2

allow_anonymous true
