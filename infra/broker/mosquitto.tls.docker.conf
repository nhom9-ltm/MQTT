# ==========================================================
#  Mosquitto trong Docker — bản BẬT TLS. Giống mosquitto.conf, thêm cổng 8883 (MQTT/TLS) và 8443 (wss).
#  Dùng qua:  docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d --force-recreate mosquitto
#  Tạo chứng chỉ trước:  python infra/broker/gen_certs.py   (xem docs/TLS.md)
# ==========================================================

persistence true
persistence_location /mosquitto/data/
autosave_interval 30

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%d %H:%M:%S

sys_interval 5

# --- Không mã hóa (giữ để so sánh khi demo; xóa nếu chỉ muốn cho TLS)
listener 1883
protocol mqtt

listener 9001
protocol websockets

# --- Mã hóa TLS
listener 8883
protocol mqtt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

listener 8443
protocol websockets
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

allow_anonymous true
