# ==========================================================
#  Mosquitto — bản BẬT XÁC THỰC + ACL (dùng cho Docker)
#  Giống mosquitto.conf, chỉ khác phần "Bảo mật" ở cuối.
#  Dùng qua:  docker compose -f docker-compose.yml -f docker-compose.secure.yml up -d
#  Tạo tài khoản trước:  python infra/broker/setup_auth.py
# ==========================================================

persistence true
persistence_location /mosquitto/data/
autosave_interval 30

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
# Hiện cả các lần publish/subscribe bị ACL từ chối (để demo "Denied PUBLISH")
log_type subscribe
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%d %H:%M:%S

sys_interval 5

listener 1883
protocol mqtt

listener 9001
protocol websockets

# --- Bảo mật: bắt buộc đăng nhập + phân quyền theo topic
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf
