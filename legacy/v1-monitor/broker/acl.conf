# ACL mẫu (dùng khi tắt allow_anonymous)
# %c = client id, %u = username

# Dashboard: chỉ đọc dữ liệu, được gửi lệnh cmd
user dashboard
topic read iot/#
topic write iot/+/+/cmd
topic read $SYS/#

# Logger: chỉ đọc telemetry
user logger
topic read iot/+/+/telemetry
topic read iot/+/+/status

# Mỗi cảm biến chỉ được ghi vào nhánh của chính nó (username = device id)
pattern write iot/+/%u/telemetry
pattern write iot/+/%u/status
pattern read  iot/+/%u/cmd
