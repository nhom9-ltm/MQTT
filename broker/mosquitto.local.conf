# ==========================================================
#  Mosquitto config chạy trực tiếp (không Docker) — Windows / macOS / Linux
#  Chạy từ thư mục gốc repo:  mosquitto -c broker/mosquitto.local.conf -v
#  Giống mosquitto.conf, chỉ khác persistence_location -> broker/data/
# ==========================================================

# --- Persistence: retained message + session (QoS 1/2) được lưu xuống đĩa,
#     restart broker vẫn còn số liệu cuối cùng và hàng đợi của persistent session.
persistence true
persistence_location broker/data/
autosave_interval 30

# --- Log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%d %H:%M:%S

# --- Thống kê $SYS (dashboard đọc số client đang kết nối, số message...)
sys_interval 5

# --- Listener 1: MQTT/TCP cho thiết bị (ESP32, home_sim.py), automation, logger
listener 1883
protocol mqtt

# --- Listener 2: MQTT over WebSocket cho trình duyệt (MQTT.js)
listener 9001
protocol websockets

# --- Bảo mật
# Mặc định cho phép anonymous để demo nhanh.
# Muốn bật xác thực + phân quyền (điểm cộng khi thuyết trình):
#   1) docker compose exec mosquitto mosquitto_passwd -c /mosquitto/config/passwd dashboard
#      lặp lại (bỏ -c) cho automation, logger, simulator, esp32-01 — xem acl.conf
#   2) bỏ comment 3 dòng dưới, đặt allow_anonymous false, restart broker
allow_anonymous true
# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/acl.conf
