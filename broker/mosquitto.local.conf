# ==========================================================
#  Mosquitto config cho Windows chạy cục bộ (không dùng Docker)
# ==========================================================

# --- Persistence
persistence false

# --- Log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%d %H:%M:%S

# --- Thống kê $SYS (dashboard đọc số client đang kết nối, số message...)
sys_interval 5

# --- Listener 1: MQTT/TCP cho thiết bị (ESP32, home_sim.py), automation, logger
listener 1883
protocol mqtt

# --- Listener 2: MQTT over WebSocket cho trình duyệt dashboard (MQTT.js)
listener 9001
protocol websockets

# --- Cho phép anonymous để demo nhanh
allow_anonymous true

