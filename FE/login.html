<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập — Nhà thông minh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <script src="js/session.js"></script>
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      </div>
      <div>
        <h1>Nhà thông minh</h1>
        <p class="sub">Đăng nhập để tiếp tục</p>
      </div>
    </div>

    <form class="login-form" id="loginForm" novalidate>
      <p class="login-error" id="loginError" role="alert" hidden></p>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" spellcheck="false" autofocus>
      </div>
      <div class="field">
        <label for="password">Mật khẩu</label>
        <input id="password" name="password" type="password" autocomplete="current-password">
      </div>
      <button type="submit" id="btnLogin" class="btn primary">Đăng nhập</button>
    </form>

    <p class="muted login-foot">Chỉ xem thử giao diện? <a href="index.html?demo=1">Mở chế độ Demo</a></p>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
