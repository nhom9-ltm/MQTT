<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lịch sử — Nhà thông minh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="layout/layout.css">
  <link rel="stylesheet" href="css/history.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
    </div>
    <div>
      <h1>Lịch sử</h1>
      <p class="sub">Dữ liệu từ logger → SQLite → API</p>
    </div>
  </div>
  <form class="conn" id="histForm" autocomplete="off">
    <input id="apiUrl" aria-label="API URL" spellcheck="false" title="Địa chỉ API lịch sử">
    <select id="range" aria-label="Khoảng thời gian">
      <option value="1">1 giờ</option>
      <option value="24" selected>24 giờ</option>
      <option value="168">7 ngày</option>
    </select>
    <button type="submit" class="btn primary">Tải lại</button>
    <a class="btn ghost" href="index.html">← Dashboard</a>
    <span class="pill" id="apiPill"><i></i><span>Chưa tải</span></span>
  </form>
</header>

<main class="hist">
  <div class="kpis" id="kpis"></div>

  <section class="panel wide">
    <div class="panel-head">
      <h2>Nhiệt độ &amp; độ ẩm</h2>
      <select id="room" aria-label="Phòng"></select>
    </div>
    <div class="chart-box"><canvas id="cClimate"></canvas></div>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>Điện năng theo ngày (kWh, ước tính)</h2></div>
    <div class="chart-box"><canvas id="cEnergyDay"></canvas></div>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>Thiết bị tiêu thụ nhiều nhất (kWh)</h2></div>
    <div class="chart-box"><canvas id="cEnergyDev"></canvas></div>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>Ai ra lệnh?</h2></div>
    <div class="chart-box"><canvas id="cCmdSrc"></canvas></div>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>Thiết bị bị điều khiển nhiều nhất</h2></div>
    <div class="chart-box"><canvas id="cCmdDev"></canvas></div>
  </section>

  <section class="panel wide">
    <div class="panel-head"><h2>Cảnh báo gần đây</h2></div>
    <ul class="alerts" id="alerts"></ul>
  </section>
</main>

<script src="js/history.js"></script>
</body>
</html>
